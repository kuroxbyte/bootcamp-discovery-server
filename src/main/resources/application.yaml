server:
  port: ${SERVER_PORT:8761}

spring:
  application:
    name: discovery-server

eureka:
  instance:
    hostname: ${EUREKA_HOSTNAME:localhost}
  client:
    # Es el propio registro: no se registra ni consulta a otro servidor.
    register-with-eureka: false
    fetch-registry: false
  server:
    enable-self-preservation: false
    # Publica los cambios del registro cada 3 s (por defecto 30 s) y revisa cada 5 s las
    # instancias que dejaron de enviar heartbeat.
    response-cache-update-interval-ms: 3000
    eviction-interval-timer-in-ms: 5000
  dashboard:
    # Panel de control disponible en http://localhost:8761/
    enabled: true
    path: /

management:
  endpoints:
    web:
      exposure:
        include: health
